<div class="space-y-6 pb-24">
  <!-- Header Title -->
  <div class="flex justify-between items-center px-0.5">
    <div>
      <h2 class="text-xl font-extrabold tracking-tight text-stone-900 dark:text-white" data-i18n="cal-title">Transaction Calendar</h2>
      <p class="text-[11px] font-medium text-stone-500 dark:text-stone-400 mt-0.5 lang-custom" data-id="Pantau arus kas harian per tanggal" data-en="Track daily cashflow by date">Pantau arus kas harian per tanggal</p>
    </div>
    <button type="button" onclick="openModal('modal-trx', 'OUTFLOW')" class="w-9 h-9 rounded-full bg-[#0F5132] hover:bg-[#0B3F27] dark:bg-emerald-500 dark:hover:bg-emerald-400 text-white dark:text-[#070908] flex items-center justify-center shadow-md shadow-emerald-950/15 transition active:scale-95" aria-label="Add Transaction">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
    </button>
  </div>

  <!-- Calendar Grid Card -->
  <div class="bg-white dark:bg-[#111613] p-5 rounded-[28px] shadow-[0_14px_34px_-12px_rgba(15,81,50,0.08)] dark:shadow-[0_18px_38px_-12px_rgba(0,0,0,0.65)] border border-stone-200/70 dark:border-stone-800/80 transition-colors duration-300">
    <!-- Month Switcher -->
    <div class="flex justify-between items-center mb-4 bg-[#FAF8F5] dark:bg-[#161D19] p-1.5 rounded-2xl border border-stone-200/60 dark:border-stone-800/70">
      <button type="button" onclick="changeCalMonth(-1)" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white dark:bg-[#1E2722] text-stone-700 dark:text-stone-200 hover:bg-[#0F5132] hover:text-white dark:hover:bg-emerald-500 dark:hover:text-[#070908] shadow-sm transition active:scale-90" aria-label="Previous Month">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
      </button>
      <h3 id="calendar-month-year" class="font-extrabold text-xs text-stone-900 dark:text-white uppercase tracking-widest" data-i18n="cal-month">Month</h3>
      <button type="button" onclick="changeCalMonth(1)" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white dark:bg-[#1E2722] text-stone-700 dark:text-stone-200 hover:bg-[#0F5132] hover:text-white dark:hover:bg-emerald-500 dark:hover:text-[#070908] shadow-sm transition active:scale-90" aria-label="Next Month">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>

    <!-- Day Names Row -->
    <div class="grid grid-cols-7 gap-1.5 text-center mb-2.5">
      <div class="text-[10px] font-extrabold uppercase tracking-wider text-red-500 dark:text-red-400" data-i18n="day-sun">Sun</div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500" data-i18n="day-mon">Mon</div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500" data-i18n="day-tue">Tue</div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500" data-i18n="day-wed">Wed</div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500" data-i18n="day-thu">Thu</div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500" data-i18n="day-fri">Fri</div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500" data-i18n="day-sat">Sat</div>
    </div>

    <!-- Calendar Dates Grid (Populated by js/app.js) -->
    <div id="calendar-grid" class="grid grid-cols-7 gap-1.5"></div>
  </div>

  <!-- Obsidian Lower Sheet: Daily Transaction List -->
  <div id="daily-detail-container" class="-mx-6 px-6 pt-5 pb-10 bg-[#0E1310] dark:bg-[#0D120F] rounded-t-[34px] text-white shadow-[0_-14px_35px_rgba(7,9,8,0.18)] border-t border-white/10 space-y-4 min-h-[260px]">
    <!-- Sheet Drag Handle -->
    <div class="w-10 h-1 rounded-full bg-white/20 mx-auto -mt-1"></div>

    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <h3 class="text-base font-extrabold tracking-tight text-white" id="daily-detail-title" data-i18n="cal-today">Today's Transactions</h3>
      </div>
      <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-white/10 text-emerald-300 border border-white/10 uppercase tracking-wider lang-custom" data-id="Mutasi Harian" data-en="Daily Activity">Mutasi Harian</span>
    </div>

    <div id="daily-transaction-list" class="space-y-2.5"></div>
  </div>
</div>
