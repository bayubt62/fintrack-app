<div class="space-y-6 pb-24">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-extrabold text-[#111815] dark:text-white tracking-tight" data-i18n="cal-title">Calendar</h2>
    </div>

    <!-- Calendar Card -->
    <div class="bg-white dark:bg-[#181B1A] p-5 rounded-[28px] shadow-sm border border-gray-200/80 dark:border-[#282D2A]">
        <div class="flex justify-between items-center mb-4 px-2">
            <button onclick="changeCalMonth(-1)" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 dark:bg-[#222724] hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition text-sm">❮</button>
            <h3 id="calendar-month-year" class="font-extrabold text-sm text-[#111815] dark:text-white tracking-wide uppercase" data-i18n="cal-month">Month</h3>
            <button onclick="changeCalMonth(1)" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 dark:bg-[#222724] hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition text-sm">❯</button>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center mb-3">
            <div class="text-[11px] font-bold text-gray-400 dark:text-gray-500" data-i18n="day-sun">Su</div>
            <div class="text-[11px] font-bold text-gray-400 dark:text-gray-500" data-i18n="day-mon">Mo</div>
            <div class="text-[11px] font-bold text-gray-400 dark:text-gray-500" data-i18n="day-tue">Tu</div>
            <div class="text-[11px] font-bold text-gray-400 dark:text-gray-500" data-i18n="day-wed">We</div>
            <div class="text-[11px] font-bold text-gray-400 dark:text-gray-500" data-i18n="day-thu">Th</div>
            <div class="text-[11px] font-bold text-gray-400 dark:text-gray-500" data-i18n="day-fri">Fr</div>
            <div class="text-[11px] font-bold text-gray-400 dark:text-gray-500" data-i18n="day-sat">Sa</div>
        </div>

        <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
    </div>

    <!-- Today's Transactions Container (Dark Container matching Image 2) -->
    <div id="daily-detail-container" class="bg-[#181B1A] dark:bg-[#141615] p-5 rounded-[28px] border border-[#282E2B] text-white shadow-xl space-y-3">
        <h3 class="text-sm font-bold text-white tracking-wide" id="daily-detail-title" data-i18n="cal-today">Today's Transactions</h3>
        <div id="daily-transaction-list" class="space-y-2.5"></div>
    </div>
</div>
