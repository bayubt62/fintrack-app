<div class="space-y-6 pb-24">
  <!-- Header Title & Primary Action -->
  <div class="flex justify-between items-center px-0.5">
    <div>
      <h2 class="text-xl font-extrabold tracking-tight text-stone-900 dark:text-white" data-i18n="port-title">Assets & Portfolio</h2>
      <p class="text-[11px] font-medium text-stone-500 dark:text-stone-400 mt-0.5 lang-custom" data-id="Alokasi investasi & target kekayaan" data-en="Investment allocation & wealth goals">Alokasi investasi & target kekayaan</p>
    </div>
    <button type="button" onclick="openModal('modal-buy-asset')" class="text-xs font-bold bg-[#0F5132] hover:bg-[#0B3F27] dark:bg-emerald-500 dark:hover:bg-emerald-400 text-white dark:text-[#070908] px-4 py-2.5 rounded-full shadow-lg shadow-emerald-950/15 active:scale-95 transition flex items-center gap-1.5" data-i18n="btn-buy-asset">+ Buy Asset</button>
  </div>

  <!-- Wealth Distribution Doughnut Card -->
  <div class="bg-white dark:bg-[#111613] p-6 rounded-[28px] shadow-[0_14px_34px_-12px_rgba(15,81,50,0.08)] dark:shadow-[0_18px_38px_-12px_rgba(0,0,0,0.65)] border border-stone-200/70 dark:border-stone-800/80 text-center transition-all duration-300 relative overflow-hidden">
    <!-- Subtle Ambient Emerald Glow -->
    <div class="absolute -right-12 -top-12 w-36 h-36 rounded-full bg-[#0F5132]/5 dark:bg-emerald-500/10 blur-2xl pointer-events-none"></div>

    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-4 rounded-full bg-[#0F5132] dark:bg-emerald-400"></span>
        <h3 class="text-xs font-extrabold uppercase tracking-wider text-stone-700 dark:text-stone-200" data-i18n="port-dist">Wealth Distribution</h3>
      </div>
      <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-[#EDF5F0] dark:bg-emerald-500/15 text-[#0F5132] dark:text-emerald-300 border border-[#0F5132]/15 dark:border-emerald-500/25 lang-custom" data-id="Portofolio Aktif" data-en="Active Portfolio">Portofolio Aktif</span>
    </div>

    <div class="relative w-52 h-52 mx-auto my-2">
      <canvas id="portfolioChart"></canvas>
      <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-4">
        <p class="text-[10px] font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500" data-i18n="port-net">Total Net Asset</p>
        <p class="text-sm font-black privacy-mask text-stone-900 dark:text-white mt-0.5 truncate max-w-[130px]" id="porto-center-val">Rp 0</p>
      </div>
    </div>
  </div>

  <!-- Investment Wallets Section -->
  <div class="bg-white dark:bg-[#111613] p-5 rounded-[28px] shadow-sm border border-stone-200/70 dark:border-stone-800/80 space-y-3.5 transition-colors duration-300">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-4 rounded-full bg-[#0F5132] dark:bg-emerald-400"></span>
        <h3 class="text-sm font-extrabold text-stone-900 dark:text-white" data-i18n="port-wallet-title">Investment Wallets</h3>
      </div>
      <button type="button" onclick="openModal('modal-add-wallet')" class="text-[11px] font-bold px-3 py-1.5 rounded-full bg-[#EDF5F0] hover:bg-[#DFECE4] dark:bg-emerald-500/15 dark:hover:bg-emerald-500/25 text-[#0F5132] dark:text-emerald-300 border border-[#0F5132]/15 dark:border-emerald-500/25 transition active:scale-95" data-i18n="btn-add-wallet">+ Add Wallet</button>
    </div>
    <div id="wallet-list" class="space-y-2.5"></div>
  </div>

  <!-- Asset Ownership List Section -->
  <div class="space-y-3">
    <div class="flex items-center justify-between px-0.5">
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-4 rounded-full bg-[#0F5132] dark:bg-emerald-400"></span>
        <h3 class="text-sm font-extrabold text-stone-900 dark:text-white" data-i18n="port-list">Asset Ownership List</h3>
      </div>
      <span class="text-[10px] font-bold text-stone-400 dark:text-stone-500 uppercase tracking-wider lang-custom" data-id="Kepemilikan" data-en="Holdings">Kepemilikan</span>
    </div>
    <div id="asset-list" class="space-y-2.5"></div>
  </div>

  <!-- Target Savings Progress Section -->
  <div class="bg-[#0E1310] dark:bg-[#0D120F] -mx-6 px-6 pt-5 pb-8 rounded-t-[34px] text-white shadow-[0_-14px_35px_rgba(7,9,8,0.16)] border-t border-white/10 space-y-4">
    <!-- Sheet Handle -->
    <div class="w-10 h-1 rounded-full bg-white/20 mx-auto -mt-1"></div>

    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <h3 class="text-base font-extrabold tracking-tight text-white" data-i18n="port-prog">Target Savings Progress</h3>
      </div>
      <button type="button" onclick="openModal('modal-goal')" class="text-[11px] font-bold px-3 py-1.5 rounded-full bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-400/25 transition active:scale-95" data-i18n="btn-add-goal">+ Create Target</button>
    </div>
    <div id="porto-goals-list" class="space-y-3"></div>
  </div>
</div>
