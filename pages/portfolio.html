<div class="space-y-6 pb-24">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-extrabold text-[#111815] dark:text-white tracking-tight" data-i18n="port-title">Assets & Portfolio</h2>
        <button onclick="openModal('modal-buy-asset')" class="text-xs font-bold bg-[#183B2B] text-[#2CE59B] dark:bg-[#2CE59B] dark:text-black px-4 py-2 rounded-full shadow-sm hover:opacity-90 active:scale-95 transition" data-i18n="btn-buy-asset">+ Buy Asset</button>
    </div>

    <!-- Wealth Distribution Chart Card -->
    <div class="bg-white dark:bg-[#181B1A] p-6 rounded-[28px] shadow-sm border border-gray-200/80 dark:border-[#282D2A] text-center transition-all duration-300">
        <h3 class="text-xs font-bold uppercase tracking-wider mb-4 dark:text-gray-200" data-i18n="port-dist">Wealth Distribution</h3>
        <div class="relative w-48 h-48 mx-auto mb-6">
            <canvas id="portfolioChart"></canvas>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <p class="text-[10px] text-gray-400 uppercase tracking-wider" data-i18n="port-net">Total Net Asset</p>
                <p class="text-xs font-extrabold privacy-mask text-[#111815] dark:text-white mt-0.5" id="porto-center-val">Rp 0</p>
            </div>
        </div>
    </div>

    <!-- Investment Wallets -->
    <div class="space-y-3">
        <div class="flex justify-between items-center">
            <h3 class="text-sm font-bold dark:text-gray-200" data-i18n="port-wallet-title">Investment Wallets</h3>
            <button onclick="openModal('modal-add-wallet')" class="text-xs font-bold text-[#183B2B] dark:text-[#2CE59B] hover:opacity-80 transition" data-i18n="btn-add-wallet">+ Add Wallet</button>
        </div>
        <div id="wallet-list" class="space-y-2"></div>
    </div>

    <!-- Asset Ownership List -->
    <div class="space-y-3">
        <h3 class="text-sm font-bold dark:text-gray-200" data-i18n="port-list">Asset Ownership List</h3>
        <div id="asset-list" class="space-y-2"></div>
    </div>

    <!-- Target Savings Progress -->
    <div class="space-y-3">
        <div class="flex justify-between items-center">
            <h3 class="text-sm font-bold dark:text-gray-200" data-i18n="port-prog">Target Savings Progress</h3>
            <button onclick="openModal('modal-goal')" class="text-xs font-bold text-[#183B2B] dark:text-[#2CE59B] hover:opacity-80 transition" data-i18n="btn-add-goal">+ Create Target</button>
        </div>
        <div id="porto-goals-list" class="space-y-3"></div>
    </div>
</div>
