<div class="space-y-6 pb-24" id="dashboard-container">
    <!-- Current Balance Card (Forest Green Hero Card) -->
    <div class="bg-[#183B2B] dark:bg-[#142E22] p-6 rounded-[28px] text-white shadow-xl relative overflow-hidden border border-[#284E3B] dark:border-[#1E3E2E]">
        <div class="flex justify-between items-center mb-1">
            <p class="text-xs text-[#A8C5B5] font-medium tracking-wide uppercase" data-i18n="dash-bal">Current Balance</p>
            <button onclick="togglePrivacy()" class="text-[#A8C5B5] hover:text-white transition p-1" title="Toggle Privacy">
                <svg id="privacy-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
        </div>
        <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight privacy-mask text-white mt-1" data-value="0" id="main-balance">Rp 0</h2>

        <!-- Integrated Monthly Summary Badges -->
        <div class="flex flex-wrap items-center gap-2.5 mt-5 pt-4 border-t border-white/10">
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 dark:bg-black/25 backdrop-blur-sm text-xs text-white/90 font-medium">
                <span data-i18n="dash-inc">Income</span>
                <span class="text-[#2CE59B] font-bold">↗</span>
                <span class="font-extrabold text-white privacy-mask" data-value="0" id="summary-income">Rp 0</span>
            </div>
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 dark:bg-black/25 backdrop-blur-sm text-xs text-white/90 font-medium">
                <span data-i18n="dash-exp">Expenditure</span>
                <span class="text-red-400 font-bold">↘</span>
                <span class="font-extrabold text-white privacy-mask" data-value="0" id="summary-expense">Rp 0</span>
            </div>
        </div>
    </div>

    <!-- Quick Action Menu (Warm Cream Squircles in Light, Charcoal in Dark) -->
    <div>
        <div class="grid grid-cols-4 gap-3 text-center">
            <div class="flex flex-col items-center gap-2 cursor-pointer group" onclick="openModal('modal-trx', 'INFLOW')">
                <button class="w-16 h-16 rounded-2xl bg-[#EAE3D2] dark:bg-[#1E2220] border border-[#DDD4C1] dark:border-[#2C322F] flex items-center justify-center text-[#183B2B] dark:text-[#2CE59B] shadow-sm group-hover:scale-105 active:scale-95 transition-all duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                <span class="text-xs font-semibold text-gray-700 dark:text-gray-300" data-i18n="qm-topup">Top up</span>
            </div>
            <div class="flex flex-col items-center gap-2 cursor-pointer group" onclick="openModal('modal-trx', 'OUTFLOW')">
                <button class="w-16 h-16 rounded-2xl bg-[#EAE3D2] dark:bg-[#1E2220] border border-[#DDD4C1] dark:border-[#2C322F] flex items-center justify-center text-[#183B2B] dark:text-[#2CE59B] shadow-sm group-hover:scale-105 active:scale-95 transition-all duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                </button>
                <span class="text-xs font-semibold text-gray-700 dark:text-gray-300" data-i18n="qm-pay">Pay</span>
            </div>
            <div class="flex flex-col items-center gap-2 cursor-pointer group" onclick="openModal('modal-transfer')">
                <button class="w-16 h-16 rounded-2xl bg-[#EAE3D2] dark:bg-[#1E2220] border border-[#DDD4C1] dark:border-[#2C322F] flex items-center justify-center text-[#183B2B] dark:text-[#2CE59B] shadow-sm group-hover:scale-105 active:scale-95 transition-all duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                </button>
                <span class="text-xs font-semibold text-gray-700 dark:text-gray-300" data-i18n="qm-tf">Transfer</span>
            </div>
            <div class="flex flex-col items-center gap-2 cursor-pointer group" onclick="openModal('modal-recurring')">
                <button class="w-16 h-16 rounded-2xl bg-[#EAE3D2] dark:bg-[#1E2220] border border-[#DDD4C1] dark:border-[#2C322F] flex items-center justify-center text-[#183B2B] dark:text-[#2CE59B] shadow-sm group-hover:scale-105 active:scale-95 transition-all duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <span class="text-xs font-semibold text-gray-700 dark:text-gray-300" data-i18n="qm-rec">Recurring</span>
            </div>
        </div>
    </div>

    <!-- Your Accounts Section (Dark Sheet / Card Carousel) -->
    <div class="bg-[#181B1A] dark:bg-[#141615] p-5 rounded-[32px] border border-[#282E2B] text-white shadow-xl">
        <div class="w-8 h-1 bg-gray-600/70 rounded-full mx-auto mb-4"></div>
        <div class="flex justify-between items-center mb-4 px-1">
            <h3 class="text-sm font-bold text-white tracking-wide" data-i18n="dash-acc">Your Accounts</h3>
            <span class="text-xs font-semibold text-gray-400 tracking-wider">Cards</span>
        </div>
        <div id="accounts-list" class="overflow-hidden"></div>
    </div>

    <!-- Active Subscriptions -->
    <div class="space-y-3">
        <h3 class="text-sm font-bold dark:text-gray-200" data-i18n="dash-sub">Active Subscriptions</h3>
        <div id="recurring-list" class="space-y-2.5"></div>
    </div>

    <!-- Debts & Receivables -->
    <div class="space-y-3">
        <div class="flex justify-between items-center">
            <h3 class="text-sm font-bold dark:text-gray-200" data-i18n="dash-debt">Debts & Receivables</h3>
            <div class="flex gap-3">
                <button onclick="openModal('modal-debt-history')" class="text-xs font-bold text-gray-500 hover:text-gray-800 dark:hover:text-gray-300 transition" data-i18n="btn-hist-debt">Riwayat</button>
                <button onclick="openModal('modal-debt')" class="text-xs font-bold text-[#183B2B] dark:text-[#2CE59B] hover:opacity-80 transition" data-i18n="btn-add-debt">+ Add Debt</button>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div class="p-3.5 bg-red-500/10 dark:bg-red-950/20 rounded-2xl border border-red-500/20">
                <p class="text-[10px] font-semibold text-red-600 dark:text-red-400 uppercase tracking-wider" data-i18n="txt-mydebt">My Debt</p>
                <p id="debt-out" class="font-black text-sm text-red-600 dark:text-red-400 privacy-mask mt-1" data-value="0">Rp 0</p>
            </div>
            <div class="p-3.5 bg-[#2CE59B]/10 dark:bg-[#2CE59B]/15 rounded-2xl border border-[#2CE59B]/30">
                <p class="text-[10px] font-semibold text-emerald-700 dark:text-[#2CE59B] uppercase tracking-wider" data-i18n="txt-receivable">Receivables</p>
                <p id="debt-in" class="font-black text-sm text-emerald-700 dark:text-[#2CE59B] privacy-mask mt-1" data-value="0">Rp 0</p>
            </div>
        </div>
        <div id="debt-list" class="space-y-2 mt-2"></div>
    </div>

    <!-- Target Savings Progress -->
    <div class="space-y-3">
        <div class="flex justify-between items-center">
            <h3 class="text-sm font-bold dark:text-gray-200" data-i18n="port-prog">Target Savings Progress</h3>
            <button onclick="openModal('modal-goal')" class="text-xs font-bold text-[#183B2B] dark:text-[#2CE59B] hover:opacity-80 transition" data-i18n="btn-add-goal">+ Create Target</button>
        </div>
        <div id="goals-list" class="space-y-3"></div>
    </div>
</div>
